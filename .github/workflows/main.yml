name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          $THEOS/bin/nic.pl -n iphoneos -v 14.0 || true
          curl -L https://github.com/theos/sdks/archive/master.zip -o sdk.zip
          unzip -q sdk.zip -d /tmp/
          cp -R /tmp/sdks-master/* $THEOS/sdks/
      - name: Build
        run: |
          export THEOS=~/theos
          export PATH=$THEOS/bin:$PATH
          make package
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: tweak-dylib
          path: .theos/obj/debug/*.dylib
